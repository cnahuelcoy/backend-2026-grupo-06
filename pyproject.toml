[project]
name = "proyectobackend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carlos Nahuelcoy", email = "cnahuelcoy2026@alu.uct.cl" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic>=2.13.5",
    "pyjwt>=2.10,<3",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.52.4",
]

[project.scripts]
proyectobackend = "proyectobackend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.10",
    "ruff>=0.17.6",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["F401"]
"src/proyectobackend/database/init_db.py" = ["F401"]

[tool.coverage.run]
source = ["proyectobackend"]
patch = ["subprocess"]
data_file = "${COVERAGE_FILE-.coverage}"
